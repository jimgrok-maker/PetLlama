name: Build debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          
      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest --stacktrace
     
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PetLlama-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetLlama-debug
          path: PetLlama-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('debug-{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Debug APK {0}', github.run_number) || format('PetLlama {0}', github.ref_name) }}
          make_latest: true
          body: |
            Installable debug build of PetLlama for Android phones (Android 8 or newer).

            Download **PetLlama-debug.apk**, open it on the phone, and allow the install if Android asks.
            Commit: ${{ github.sha }}
          files: PetLlama-debug.apk
